<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chorégraphie Grue</title>
<style>:root{--bg:#fff;--surface:#fff;--ink:#16181a;--line:#d8dcdf}</style>
</head>
<body>
<script>
/* Mode hors Claude : stockage local au navigateur (test). Remplacé plus tard par une vraie base en ligne. */
if(!(window.claude&&window.claude.use)){(function(){
  const KEY="cg-local-db",subs={};let data={};
  try{data=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}};
  const snap=c=>({docs:Object.entries(data[c]||{}).map(([id,v])=>({id,data:()=>JSON.parse(JSON.stringify(v))}))});
  const fire=c=>(subs[c]||[]).forEach(f=>{try{f(snap(c))}catch(e){}});
  const rid=()=>Math.random().toString(36).slice(2,12);
  const put=(c,id,v)=>{(data[c]=data[c]||{})[id]=v;save();fire(c)};
  const docRef=(c,id)=>({id,
    set:async v=>put(c,id,{...v}),
    update:async v=>put(c,id,{...((data[c]||{})[id]||{}),...v}),
    delete:async()=>{if(data[c]){delete data[c][id];save();fire(c)}},
    get:async()=>{const v=(data[c]||{})[id];return {exists:!!v,id,data:()=>v?JSON.parse(JSON.stringify(v)):undefined}},
    onSnapshot:(ok)=>{const f=()=>{const v=(data[c]||{})[id];ok({exists:!!v,id,data:()=>v?JSON.parse(JSON.stringify(v)):undefined})};(subs[c]=subs[c]||[]).push(f);setTimeout(f,0);return()=>{subs[c]=subs[c].filter(x=>x!==f)}}});
  const db={
    collection:c=>({
      doc:id=>docRef(c,id||rid()),
      add:async v=>{const id=rid();put(c,id,{...v});return docRef(c,id)},
      onSnapshot:(ok)=>{(subs[c]=subs[c]||[]).push(ok);setTimeout(()=>ok(snap(c)),0);return()=>{subs[c]=subs[c].filter(f=>f!==ok)}}
    }),
    doc:p=>{const [c,id]=p.split("/");return docRef(c,id)}
  };
  window.claude={use:async n=>n==="db"?db:null};
})()}
</script>
<title>Chorégraphie Grue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one-column site app — sticky day header, occupancy strip, vertical crane timeline, bottom tab bar. Concrete neutrals + crane yellow. */
:root{
  --bg:#eef0ee; --surface:#ffffff; --surface-2:#f5f6f4; --line:#d5d9d4; --ink:#1b1f1d; --muted:#5d6560;
  --crane:#f2b705; --crane-ink:#1b1f1d; --crane-soft:#fdf1c4;
  --fixe:#c8352b; --souple:#d97a0c; --libre:#2f8a4f; --info:#2a5d9f;
  --fixe-soft:#fbe6e3; --souple-soft:#fcecd8; --libre-soft:#e2f2e7; --info-soft:#e3ecf8;
  --shadow:0 1px 2px rgba(20,25,22,.08),0 4px 14px rgba(20,25,22,.06);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141716; --surface:#1d2120; --surface-2:#232826; --line:#343a37; --ink:#e9ece9; --muted:#9aa39e;
  --crane:#f2b705; --crane-ink:#1b1f1d; --crane-soft:#3a3115;
  --fixe:#ef6a5f; --souple:#f0a046; --libre:#5cc07e; --info:#7aa7e3;
  --fixe-soft:#3b2120; --souple-soft:#3a2b17; --libre-soft:#1c3324; --info-soft:#1d2a3d;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141716; --surface:#1d2120; --surface-2:#232826; --line:#343a37; --ink:#e9ece9; --muted:#9aa39e;
  --crane:#f2b705; --crane-ink:#1b1f1d; --crane-soft:#3a3115;
  --fixe:#ef6a5f; --souple:#f0a046; --libre:#5cc07e; --info:#7aa7e3;
  --fixe-soft:#3b2120; --souple-soft:#3a2b17; --libre-soft:#1c3324; --info-soft:#1d2a3d;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--crane);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 120px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:.01em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;justify-content:space-between}
.brand h1{font-size:24px;font-weight:700;display:flex;align-items:center;gap:8px}
.jib{display:inline-block;width:26px;height:20px;background:linear-gradient(var(--crane),var(--crane)) 0 3px/100% 5px no-repeat,linear-gradient(var(--crane),var(--crane)) 6px 0/5px 100% no-repeat}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-weight:600;font-size:14px}
.datebar{display:flex;align-items:center;gap:8px;margin-top:8px}
.datebar .d{flex:1;min-width:0;text-align:center;font-family:var(--f-display);font-size:20px;font-weight:600;text-transform:capitalize}
.navbtn{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:20px;font-weight:600}
.todaybtn{font-size:13px;padding:4px 8px;border-radius:6px;border:1px solid var(--line);background:var(--surface)}

/* occupancy strip */
.strip{margin-top:14px}
.bar{position:relative;height:30px;background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.bar .seg{position:absolute;top:3px;bottom:3px;border-radius:3px}
.bar .pause{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,var(--line) 0 4px,transparent 4px 8px)}
.bar .now{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.ticks{position:relative;height:16px;font-size:11px;color:var(--muted)}
.ticks span{position:absolute;transform:translateX(-50%)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.kpi b{display:block;font-family:var(--f-display);font-size:22px;line-height:1.1}
.kpi span{font-size:11.5px;color:var(--muted)}
@media (max-width:480px){.kpis{grid-template-columns:repeat(2,1fr)}}

/* alerts */
.alert{border-radius:var(--r);padding:12px 14px;margin-top:14px;border:1px solid}
.alert.conf{background:var(--fixe-soft);border-color:var(--fixe)}
.alert.warn{background:var(--souple-soft);border-color:var(--souple)}
.alert.inf{background:var(--info-soft);border-color:var(--info)}
.alert h3{font-size:18px;margin-bottom:4px}
.opts{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.opt{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;flex-wrap:wrap}
.opt p{margin:0;min-width:0;flex:1 1 220px}
.reco{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:var(--crane);color:var(--crane-ink);padding:1px 6px;border-radius:4px;margin-left:6px}

/* timeline */
.tl{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:stretch}
.time{font-family:var(--f-mono);font-size:13px;font-weight:600;padding-top:10px;text-align:right;line-height:1.2}
.time small{display:block;color:var(--muted);font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--muted);border-radius:var(--r);padding:10px 12px;box-shadow:var(--shadow);min-width:0;text-align:left;width:100%}
.card.fixe{border-left-color:var(--fixe)} .card.souple{border-left-color:var(--souple)} .card.libre{border-left-color:var(--libre)}
.card.done{opacity:.72}
.card.encours{outline:2px solid var(--crane);outline-offset:-1px}
.card .t{font-weight:600;font-size:16px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.card .meta{font-size:13px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.chip.fixe{background:var(--fixe-soft);border-color:transparent;color:var(--fixe)}
.chip.souple{background:var(--souple-soft);border-color:transparent;color:var(--souple)}
.chip.libre{background:var(--libre-soft);border-color:transparent;color:var(--libre)}
.chip.bad{background:var(--fixe);color:#fff;border-color:transparent}
.chip.ok{background:var(--libre-soft);color:var(--libre);border-color:transparent}
.q{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--muted);background:var(--surface);color:var(--muted);font:700 13px/1 var(--f-body);margin-left:8px;vertical-align:2px;padding:0;flex:none}
.q[aria-expanded="true"]{background:var(--crane);border-color:var(--crane);color:var(--crane-ink)}
.helpbox{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--crane);border-radius:8px;padding:8px 12px;font-size:13.5px;margin:6px 0 8px;font-family:var(--f-body);font-weight:400;letter-spacing:0;color:var(--ink)}
.helpbox p{margin:0}.helpbox p+p{margin-top:6px}
.badge{display:inline-block;min-width:20px;padding:1px 6px;border-radius:999px;background:var(--fixe);color:#fff;font:700 12px/1.4 var(--f-body);margin-left:5px;vertical-align:2px}
.preview{background:var(--surface-2);border-radius:8px;padding:7px 10px;font-size:13.5px;margin-top:8px}
.preview.bad{background:var(--fixe-soft);color:var(--fixe)}
.codebox{font-family:var(--f-mono);font-size:24px;font-weight:600;letter-spacing:.08em;background:var(--crane-soft);border:1px dashed var(--crane);border-radius:8px;padding:10px 12px;margin-top:4px;text-align:center;overflow-wrap:anywhere}
.sessbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:13px;background:var(--crane-soft);border-radius:6px;padding:4px 10px}
.hdrbtns{display:flex;gap:6px}
.landing{position:fixed;inset:0;z-index:35;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px 16px;overflow:auto}
.landing[hidden]{display:none}
.landing .box{width:100%;max-width:420px;text-align:center}
.landing h1{font-size:30px;margin:0 0 6px;display:flex;align-items:center;justify-content:center;gap:10px}
.landing p.sub{color:var(--muted,#667);margin:0 0 28px}
.landing .big{display:block;width:100%;margin:0 0 12px;padding:16px;font-size:18px;font-weight:700;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:inherit}
.landing .big.pri{background:var(--crane);color:var(--crane-ink);border-color:transparent}
.landing .big small{display:block;font-weight:400;font-size:13px;opacity:.8;margin-top:3px}
.landing .demo{background:none;border:none;text-decoration:underline;color:inherit;opacity:.7;margin-top:12px;font-size:14px;cursor:pointer}
.chip.rec{background:var(--crane-soft);border-color:transparent}
.chip.ex{background:var(--info-soft);color:var(--info);border-color:transparent}
.chip.run{background:var(--crane);color:var(--crane-ink);border-color:transparent}
.actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:7px 12px;font-weight:600;font-size:14px}
.btn.pri{background:var(--crane);border-color:var(--crane);color:var(--crane-ink)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.danger{color:var(--fixe);border-color:var(--fixe);background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.gap{font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:6px 10px}
.pauserow{font-family:var(--f-display);font-size:16px;font-weight:600;text-align:center;padding:8px;border-radius:8px;background:repeating-linear-gradient(135deg,var(--surface-2) 0 8px,var(--surface) 8px 16px);border:1px solid var(--line)}
.marge{font-size:11.5px;color:var(--muted);margin-top:4px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;margin-top:16px}

.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* fab + tabs */
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--crane);color:var(--crane-ink);border:none;border-radius:999px;padding:14px 20px;font-family:var(--f-display);font-size:19px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.25)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{flex:1;max-width:220px;background:none;border:none;padding:12px 4px;font-family:var(--f-display);font-size:17px;font-weight:600;color:var(--muted);border-top:3px solid transparent}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-top-color:var(--crane)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,11,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding-inline:16px;padding-block:14px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;position:sticky;top:-14px;background:var(--bg);padding-block:10px 6px}
.sheet h2{font-size:24px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-top:10px}
.sec h3{font-size:17px;margin-bottom:8px}
.fld{display:flex;flex-direction:column;gap:4px;margin-top:10px;min-width:0}
.fld label{font-size:13px;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
.fld textarea{min-height:64px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg3 button,.seg2 button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 6px;font-weight:600;font-size:14px}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg3 button[aria-pressed="true"].fixe{background:var(--fixe);border-color:var(--fixe);color:#fff}
.seg3 button[aria-pressed="true"].souple{background:var(--souple);border-color:var(--souple);color:#fff}
.seg3 button[aria-pressed="true"].libre{background:var(--libre);border-color:var(--libre);color:#fff}
.seg2 button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tpls{display:flex;gap:6px;flex-wrap:wrap}
.tpls button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:13.5px;font-weight:500}
.tpls button[aria-pressed="true"]{background:var(--crane);border-color:var(--crane);color:var(--crane-ink);font-weight:600}
.hint{font-size:12.5px;color:var(--muted);margin-top:4px}
.sugg{background:var(--crane-soft);border-radius:8px;padding:8px 10px;font-size:13.5px;margin-top:8px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}

.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:8px}
.ph{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2);aspect-ratio:1;max-width:100%;padding:0}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph span{position:absolute;left:0;right:0;bottom:0;font-size:10.5px;font-weight:600;background:rgba(0,0,0,.6);color:#fff;padding:2px 5px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addph{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-top:8px}
.addph .fld{margin-top:0;flex:1 1 140px}
.filebtn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:6px}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}

.list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0}
.item .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.item p{margin:4px 0 0;overflow-wrap:anywhere}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.t th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tw{overflow-x:auto}
.pos{color:var(--fixe);font-weight:600} .neg{color:var(--libre);font-weight:600}
h2.page{font-size:26px;margin-top:18px}
.banner{background:var(--info-soft);border:1px solid var(--info);border-radius:8px;padding:8px 12px;margin-top:10px;font-size:14px}
.lightbox{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:10px}
.lightbox img{max-height:80%;max-width:100%;border-radius:6px}
.lightbox p{color:#fff;margin:0;text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;z-index:70;font-weight:600;font-size:14px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<header class="top"><div class="wrap" style="padding-block:0">
  <div class="brand">
    <h1><span class="jib" aria-hidden="true"></span>Chorégraphie Grue</h1>
    <div class="hdrbtns"><button class="iconbtn" id="btnAccueil" type="button">Accueil</button><button class="iconbtn" id="btnLogout" type="button" data-act="acc-logout">Déconnexion</button><button class="iconbtn" id="btnReglages" type="button">Réglages</button></div>
  </div>
  <div class="sessbar" id="sessionBar" hidden></div>
  <div class="datebar">
    <button class="navbtn" id="prevDay" type="button" aria-label="Jour précédent">‹</button>
    <div class="d" id="dateLabel">…</div>
    <button class="navbtn" id="nextDay" type="button" aria-label="Jour suivant">›</button>
  </div>
  <div style="text-align:center;margin-top:4px"><button class="todaybtn" id="goToday" type="button">Aujourd'hui</button></div>
</div></header>

<main class="wrap" id="main">
  <div class="empty" id="loading">Chargement des demandes de grue…<br><span class="muted">Le planning du jour, les consignes de levage et le journal s'affichent ici.</span></div>
</main>

<button class="fab" id="fab" type="button">+ Demande grue</button>
<nav class="tabs" role="tablist">
  <button role="tab" data-tab="jour" aria-selected="true" type="button">Journée</button>
  <button role="tab" data-tab="consignes" aria-selected="false" type="button">Consignes</button>
  <button role="tab" data-tab="demandes" aria-selected="false" type="button">Demandes<span class="badge" id="demBadge" hidden></span></button>

/* ---------- planning engine ---------- */
function plan(date){
  const R=reg(), M=R.marge;
  const W=[[toMin(R.debut),toMin(R.pauseDebut)],[toMin(R.pauseFin),toMin(R.fin)]];
  const tasks=tasksFor(date);
  const busy=[], items=[], conflicts=[], unplaced=[];
  const today = date===todayStr(), now=nowMin();
  const inWin=(s,e)=>W.some(w=>s>=w[0]&&e<=w[1]);
  const overlaps=(s,e)=>busy.filter(b=>s<b.e && b.s<e+M);
  // 1. réalisé
  const realises=[];
  for(const t of tasks.filter(t=>t.statut==="termine")){
    if(!t.debutReel&&!t.finReel){realises.push(t);continue}
    const s=toMin(t.debutReel)??toMin(t.heure)??W[0][0], e=toMin(t.finReel)??(s+t.duree);
    const it={t,s,e,kind:"reel",flags:[]};items.push(it);busy.push({s,e:e+M,it});
  }
  // 2. en cours
  for(const t of tasks.filter(t=>t.statut==="en_cours")){
    const s=toMin(t.debutReel)??W[0][0];let e=s+t.duree;const it={t,s,e,kind:"encours",flags:[]};
    if(today && now>e){it.flags.push({c:"bad",l:"Dépasse de "+dur(now-e)});it.e=e=now;}
    items.push(it);busy.push({s,e:e+M,it});
  }
  // 3. fixes
  const todo=tasks.filter(t=>t.statut!=="termine"&&t.statut!=="en_cours");
  for(const t of todo.filter(t=>t.type==="fixe").sort((a,b)=>toMin(a.heure)-toMin(b.heure))){
    const s=toMin(t.heure)??W[0][0], e=s+t.duree;const it={t,s,e,kind:"fixe",flags:[]};
    for(const b of overlaps(s,e)){conflicts.push({a:b.it,b:it});it.flags.push({c:"bad",l:"Conflit"});b.it.conf=true}
    if(!inWin(s,e))it.flags.push({c:"bad",l:"Hors horaires grue"});
    items.push(it);busy.push({s,e:e+M,it});
  }
  // 4. souples puis libres
  const recalc=toMin(S.jours[date]?.recalc);
  const earliest=Math.max(W[0][0], recalc??0);
  function findSlot(from,d){
    const cands=[from,...busy.map(b=>b.e),...W.map(w=>w[0])].filter(c=>c>=from).sort((a,b)=>a-b);
    for(const c of cands){ if(inWin(c,c+d) && overlaps(c,c+d).length===0) return c; }
    return null;
  }
  const souples=todo.filter(t=>t.type==="souple").sort((a,b)=>(toMin(a.fenFin)??9999)-(toMin(b.fenFin)??9999)||(toMin(a.heure)??0)-(toMin(b.heure)??0));
  const libres=todo.filter(t=>t.type!=="fixe"&&t.type!=="souple").sort((a,b)=>(a.createdAt||"").localeCompare(b.createdAt||""));
  for(const t of [...souples,...libres]){
    const from=Math.max(earliest, t.type==="souple"?(toMin(t.heure)??0):0);
    const s=findSlot(from,t.duree);
    if(s==null){unplaced.push(t);continue}
    const it={t,s,e:s+t.duree,kind:"auto",flags:[]};
    if(t.type==="souple"&&toMin(t.fenFin)!=null&&it.e>toMin(t.fenFin))it.flags.push({c:"bad",l:"Après "+t.fenFin+" souhaité"});
    items.push(it);busy.push({s,e:it.e+M,it});
  }
  items.sort((a,b)=>a.s-b.s);
  function slotFor(from,d,exclId){
    const hard=busy.filter(b=>b.it.kind!=="auto"&&b.it.t.id!==exclId);
    const cands=[from,...hard.map(b=>b.e),...W.map(w=>w[0])].filter(c=>c>=from).sort((a,b)=>a-b);
    for(const c of cands){if(inWin(c,c+d)&&!hard.some(b=>c<b.e&&b.s<c+d+M))return c}
    return null;
  }
  let largestGap=0;
  for(const w of W){let c=Math.max(w[0],earliest);const bs=busy.filter(b=>b.e>w[0]&&b.s<w[1]).sort((a,b)=>a.s-b.s);
    for(const b of bs){if(b.s>c)largestGap=Math.max(largestGap,b.s-c);c=Math.max(c,b.e)}
    if(w[1]>c)largestGap=Math.max(largestGap,w[1]-c)}
  return {items,conflicts,unplaced,realises,W,M,slotFor,largestGap};
}

/* ---------- learning ---------- */
function learning(){
  const by={};
  for(const t of S.taches){
    if(t.statut!=="termine")continue;const s=toMin(t.debutReel),e=toMin(t.finReel);if(s==null||e==null||e<=s)continue;
    const k=t.modele||"autre";(by[k]=by[k]||{k,n:0,prev:0,reel:0});by[k].n++;by[k].prev+=t.duree;by[k].reel+=(e-s);
  }
  return Object.values(by).map(o=>({...o,prev:o.prev/o.n,reel:o.reel/o.n,ecart:(o.reel-o.prev)/o.n}));
}

async function hashCode(posteId,code){const s=posteId+":"+String(code).replace(/[^A-Za-z0-9]/g,"").toUpperCase();

function roleLabel(p){return p.role==="grutier"?"Grutier "+(p.rang||""):(ROLES[p.role]||p.role)}
function plusUnMois(iso){const d=new Date(iso);d.setMonth(d.getMonth()+1);return d.toISOString().slice(0,10)}
function saveSession(){try{if(S.session)localStorage.setItem("cg-session",JSON.stringify(S.session));else localStorage.removeItem("cg-session")}catch(e){}}
function applyRole(){
  const b=S.base;if(!b)return;const r=S.session&&S.session.role;
  if(!r||r==="chef_chantier"||r==="chef_manoeuvre"){S.isChef=b.isChef;S.canWrite=b.canWrite;S.canAsk=b.canAsk}
  else if(r==="chef_equipe"){S.isChef=false;S.canWrite=false;S.canAsk=true}
  else{S.isChef=false;S.canWrite=false;S.canAsk=false}
}
function checkSession(){
  if(!S.session||!S.postesLoaded)return;
  const p=S.postes.find(x=>x.id===S.session.posteId);
  if(!p||p.statut!=="actif"){S.session=null;saveSession();applyRole();toast("Votre accès à ce chantier a changé : vous êtes déconnecté")}
}
function accBack(){return S.acc.view==="home"?"":`<div class="actions" style="margin-top:0"><button class="btn" data-act="acc-go" data-v="home" type="button">‹ Accueil</button></div>`}
function fld(id,label,val,extra){return `<div class="fld"><label for="${id}">${label}</label><input id="${id}" value="${esc(val||"")}" ${extra||""}></div>`}
function drawAccueil(){
  const A=S.acc;
  let h=`<div data-acc="1"><header><h2>Accueil${q("accueil")}</h2><button class="btn" data-act="close" type="button">Fermer</button></header>${hbox("accueil")}`;
  h+=`<div class="banner">Parcours de test : les droits sont simulés à l'écran et ne protègent rien. Utilisez des noms, adresses mail et numéros de carte fictifs.</div>`;
  if(A.err)h+=`<div class="alert conf" style="margin-top:10px"><b>${esc(A.err)}</b></div>`;
  if(A.msg)h+=`<div class="alert inf" style="margin-top:10px">${esc(A.msg)}</div>`;
  h+=accBack();
  h+=({home:accHome,create:accCreate,created:accCreated,login:accLogin,renew:accRenew,mailbox:accMailbox,space:accSpace}[A.view]||accHome)();
  openSheet(h+`</div>`);
}
function accHome(){
  const s=S.session;let h="";
  if(s){
    h+=`<div class="sec"><h3>Connecté</h3><p style="margin:0"><b>${esc(s.prenom)} ${esc(s.nom)}</b> · ${esc(s.roleLabel)}<br><span class="muted">Chantier ${esc(s.chantierNom)} (${esc(s.ident)})</span></p><div class="actions">`;
    if(s.role==="chef_chantier")h+=`<button class="btn pri" data-act="acc-go" data-v="space" type="button">Espace chantier</button>`;
    h+=`<button class="btn" data-act="close" type="button">Ouvrir le planning</button><button class="btn danger" data-act="acc-logout" type="button">Se déconnecter</button></div></div>`;
  } else {
    h+=`<div class="list"><button class="item" data-act="acc-go" data-v="create" type="button" style="text-align:left;cursor:pointer"><b style="font-size:18px">Créer un chantier</b><p class="muted">Pour le chef de chantier : entreprise, chantier, adresse, dates. Un identifiant et un code sont générés.</p></button><button class="item" data-act="acc-go" data-v="login" type="button" style="text-align:left;cursor:pointer"><b style="font-size:18px">Se connecter</b><p class="muted">Identifiant du chantier, nom, prénom, mail et code reçu du chef de chantier.</p></button></div>`;
  }
  h+=`<div class="actions"><button class="btn" data-act="acc-go" data-v="mailbox" type="button">Boîte mail simulée (${S.mails.length})</button></div>`;
  return h;
}
function accCreate(){
  const P=S.acc.prefill||{};const d0=todayStr();
  let h=`<div class="sec"><h3>Nouveau chantier</h3>`;
  h+=fld("cEnt","Nom de l'entreprise",P.entreprise)+fld("cNom","Nom du chantier",P.nom)+fld("cAdr","Adresse du chantier",P.adresse);
  h+=`<div class="two">${fld("cChefNom","Nom du chef de chantier",P.chefNom)}${fld("cChefPre","Prénom",P.chefPre)}</div>`;
  h+=fld("cMail","Adresse mail du chef de chantier",P.mail,'type="email" inputmode="email"');
  h+=`<div class="two"><div class="fld"><label for="cDeb">Date de début</label><input id="cDeb" type="date" value="${esc(P.debut||d0)}"></div><div class="fld"><label for="cFin">Date de fin</label><input id="cFin" type="date" value="${esc(P.fin||addDays(d0,90))}"></div></div>`;
  if(S.assets)h+=`<div class="fld"><label for="cLogo">Logo (facultatif)</label><input id="cLogo" type="file" accept="image/*"></div>`;

function accCreated(){
  const L=S.acc.last;if(!L)return accHome();
  return `<div class="sec"><h3>Chantier créé</h3><p style="margin:0 0 6px">${esc(L.chantierNom)} · ${esc(L.entreprise)}</p><div class="lbl">Identifiant du chantier</div><div class="codebox">${esc(L.ident)}</div><div class="lbl" style="margin-top:10px">Code du chef de chantier (affiché une seule fois)</div><div class="codebox">${esc(L.code)}</div><p class="hint">Notez ces deux informations : le code n'est plus affichable ensuite, il faudra en demander un nouveau.</p><div class="actions"><button class="btn pri" data-act="acc-tologin" type="button">Me connecter maintenant</button></div></div>`;
}
function accLogin(){
  const P=S.acc.prefill||{};
  let h=`<div class="sec"><h3>Se connecter</h3>${fld("lgId","Identifiant du chantier",P.ident,'autocapitalize="characters" placeholder="CH-XXXXX"')}<div class="two">${fld("lgNom","Nom",P.nom)}${fld("lgPrenom","Prénom",P.prenom)}</div>${fld("lgMail","Adresse mail",P.mail,'type="email" inputmode="email"')}${fld("lgCode","Code reçu du chef de chantier","",'autocapitalize="characters" placeholder="XXXX-XXXX"')}<div class="actions"><button class="btn pri" data-act="acc-login" type="button" style="flex:1;padding:12px">Se connecter</button></div><div class="actions"><button class="btn" data-act="acc-go" data-v="renew" type="button">Recevoir un nouveau code par mail</button></div></div>`;

function accRenew(){
  const P=S.acc.prefill||{};
  return `<div class="sec"><h3>Nouveau code par mail</h3><p class="muted" style="margin:0">Le code précédent devient invalide dès qu'un nouveau est envoyé.</p>${fld("rnId","Identifiant du chantier",P.ident,'autocapitalize="characters" placeholder="CH-XXXXX"')}${fld("rnMail","Adresse mail",P.mail,'type="email" inputmode="email"')}<div class="actions"><button class="btn pri" data-act="acc-renew" type="button">Envoyer un nouveau code</button></div></div>`;
}
function accMailbox(){
  let h=`<div class="sec"><h3>Boîte mail simulée</h3><p class="muted" style="margin:0">Aucun vrai mail n'est envoyé : les messages du parcours s'affichent ici.</p></div>`;
  if(!S.mails.length)return h+`<div class="empty">Aucun message pour l'instant.</div>`;
  h+=`<div class="list">`+S.mails.map((m,i)=>`<div class="item"><div class="h"><b>${esc(m.objet)}</b><span class="muted" style="font-size:12.5px">${esc(m.at)}</span></div><p class="muted" style="font-size:13px">À : ${esc(m.to)}</p><p>${esc(m.corps)}</p>${m.code?`<div class="codebox">${esc(m.code)}</div>`:""}${m.action&&!m.done?`<div class="actions"><button class="btn pri" data-act="acc-verify" data-i="${i}" type="button">Confirmer mon adresse</button></div>`:""}${m.done?`<p class="muted">Lien utilisé</p>`:""}</div>`).join("")+`</div>`;
  return h;
}
function accSpace(){
  const s=S.session;
  if(!s||s.role!=="chef_chantier")return `<div class="empty">L'espace chantier est réservé au chef de chantier connecté.</div>`;
  const ch=S.chantiers.find(c=>c.id===s.chantierId);if(!ch)return `<div class="empty">Chantier introuvable.</div>`;
  const A=S.acc;
  let h=`<div class="sec">${ch.logoId?`<img src="${blobUrl(ch.logoId)}" alt="Logo" style="max-height:48px;max-width:160px;margin-bottom:6px">`:""}<h3>${esc(ch.nom)}</h3><p style="margin:0">${esc(ch.entreprise)} · ${esc(ch.adresse)}<br><span class="muted">Du ${esc(dateLong(ch.debut))} au ${esc(dateLong(ch.fin))}</span></p><div class="lbl" style="margin-top:8px">Identifiant du chantier</div><div class="codebox">${esc(ch.ident)}</div></div>`;
  if(A.codeShown)h+=`<div class="alert warn"><h3>Code à transmettre</h3><p style="margin:0">${esc(A.codeShown.label)}, ${esc(A.codeShown.prenom)} ${esc(A.codeShown.nom)}</p><div class="codebox">${esc(A.codeShown.code)}</div><p class="hint">Affiché une seule fois. Transmettez aussi l'identifiant du chantier.</p><div class="actions"><button class="btn" data-act="acc-hidecode" type="button">J'ai noté le code</button></div></div>`;
  const ps=S.postes.filter(p=>p.chantierId===ch.id).sort((a,b)=>(a.createdAt||"").localeCompare(b.createdAt||""));
  h+=`<h3 style="font-size:19px;margin-top:16px">Postes (${ps.length})</h3><div class="list">`;
  for(const p of ps){
    const st=STATUTS[p.statut]||[p.statut,""];const conf=A.confirm&&A.confirm.id===p.id?A.confirm.v:null;
    h+=`<div class="item"><div class="h"><b>${esc(roleLabel(p))}</b><span class="chip ${st[1]}">${esc(st[0])}</span></div><p>${esc(p.prenom)} ${esc(p.nom)}</p><p class="muted" style="font-size:13px">${esc(p.mail)}${p.carte?" · carte BTP "+esc(p.carte):""}</p>`;
    if((p.statut==="fin_mission"||p.statut==="bloque")&&p.quitteLe)h+=`<p class="muted" style="font-size:13px">Données personnelles conservées jusqu'au ${esc(dateLong(plusUnMois(p.quitteLe)))}, puis identité effacée.</p>`;
    if(p.role!=="chef_chantier"){
      if(conf)h+=`<div class="actions"><span style="align-self:center">${conf==="fin"?"Mettre fin à la mission de cette personne ?":"Bloquer l'accès de cette personne à ce chantier ?"}</span><button class="btn danger" data-act="acc-pconfirm" data-id="${p.id}" data-v="${conf}" type="button">Confirmer</button><button class="btn" data-act="acc-pcancel" type="button">Annuler</button></div>`;
      else{
        let b="";
        if(p.statut==="attente"||p.statut==="actif")b=`<button class="btn" data-act="acc-pact" data-id="${p.id}" data-v="suspendre" type="button">Suspendre</button><button class="btn" data-act="acc-pact" data-id="${p.id}" data-v="fin" type="button">Fin de mission</button><button class="btn" data-act="acc-pact" data-id="${p.id}" data-v="bloquer" type="button">Bloquer</button><button class="btn" data-act="acc-pact" data-id="${p.id}" data-v="code" type="button">Nouveau code</button>`;
        else if(p.statut==="suspendu")b=`<button class="btn pri" data-act="acc-pact" data-id="${p.id}" data-v="reactiver" type="button">Réactiver</button><button class="btn" data-act="acc-pact" data-id="${p.id}" data-v="fin" type="button">Fin de mission</button><button class="btn" data-act="acc-pact" data-id="${p.id}" data-v="bloquer" type="button">Bloquer</button>`;
        else if(p.statut==="fin_mission")b=`<button class="btn pri" data-act="acc-pact" data-id="${p.id}" data-v="reintegrer" type="button">Réintégrer</button>`;
        else if(p.statut==="bloque")b=`<button class="btn pri" data-act="acc-pact" data-id="${p.id}" data-v="debloquer" type="button">Débloquer</button>`;
        h+=`<div class="actions">${b}</div>`;
      }
    }
    h+=`</div>`;
  }
  h+=`</div>`;
  if(A.newPoste){
    h+=`<div class="sec"><h3>Nouveau poste</h3><div class="fld"><label for="npRole">Poste</label><select id="npRole"><option value="chef_manoeuvre">Chef de manœuvre</option><option value="chef_equipe">Chef d'équipe</option><option value="elingueur">Élingueur</option><option value="grutier">Grutier (numéroté automatiquement)</option></select></div><div class="two">${fld("npNom","Nom","")}${fld("npPre","Prénom","")}</div>${fld("npCarte","Numéro de carte BTP (fictif pour le test)","")}${fld("npMail","Adresse mail","",'type="email" inputmode="email"')}<div class="actions"><button class="btn pri" data-act="acc-posteadd" type="button">Créer le poste et générer le code</button><button class="btn" data-act="acc-newposte" type="button">Annuler</button></div></div>`;
  } else h+=`<div class="actions"><button class="btn pri" data-act="acc-newposte" type="button">+ Créer un poste</button></div>`;
  return h;
}
function pushMail(m){S.mails.unshift({...m,at:new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})})}
function fail(msg){S.acc.err=msg;S.acc.msg="";drawAccueil()}
async function finalizeLogin(p){
  const ch=S.chantiers.find(c=>c.id===p.chantierId);
  const ok=await save(db=>db.doc("postes/"+p.id).update({statut:"actif",codeHash:"",activeLe:new Date().toISOString()}));
  if(!ok)return;
  S.session={posteId:p.id,chantierId:p.chantierId,role:p.role,roleLabel:roleLabel(p),nom:p.nom,prenom:p.prenom,chantierNom:ch?ch.nom:"",ident:ch?ch.ident:""};
  saveSession();applyRole();
  S.acc={view:"home",msg:"Connexion réussie : l'affichage suit maintenant les droits du poste "+roleLabel(p)+"."};
  if(S.tab==="demandes"&&!S.isChef&&!S.canAsk)S.tab="jour";
  render();drawAccueil();
}
async function accAction(a,el){
  const A=S.acc,v=id=>(document.getElementById(id)||{}).value||"";
  A.err="";
  if(a==="acc-go"){A.view=el.dataset.v;A.msg="";if(A.view==="login"||A.view==="renew"){}return drawAccueil()}
  if(a==="acc-tologin"){const L=A.last;A.prefill={ident:L.ident,nom:L.nom,prenom:L.prenom,mail:L.mail};A.view="login";A.msg="";return drawAccueil()}
  if(a==="acc-logout"){S.session=null;S.demo=false;saveSession();applyRole();A.view="home";A.msg="";closeSheet();render();window.scrollTo(0,0);toast("Déconnecté");return}
  if(a==="acc-land-login"){A.view="login";A.msg="";return drawAccueil()}
  if(a==="acc-land-create"){A.view="create";A.msg="";return drawAccueil()}
  if(a==="acc-land-demo"){S.demo=true;render();return}
  if(a==="acc-hidecode"){A.codeShown=null;return drawAccueil()}
  if(a==="acc-newposte"){A.newPoste=!A.newPoste;return drawAccueil()}
  if(a==="acc-create"){
    const d={entreprise:v("cEnt").trim(),nom:v("cNom").trim(),adresse:v("cAdr").trim(),chefNom:v("cChefNom").trim(),chefPre:v("cChefPre").trim(),mail:v("cMail").trim().toLowerCase(),debut:v("cDeb"),fin:v("cFin")};
    A.prefill=d;
    if(!d.entreprise||!d.nom||!d.adresse||!d.chefNom||!d.chefPre||!d.mail||!d.debut||!d.fin)return fail("Remplissez tous les champs obligatoires.");
    if(!okMail(d.mail))return fail("Adresse mail invalide.");
    if(d.fin<=d.debut)return fail("La date de fin doit être après la date de début.");
    let logoId="";const f=document.getElementById("cLogo");if(f&&f.files&&f.files[0]){logoId=(await uploadPhoto(f.files[0]))||""}
    const ident=genIdent(),code=genCode();let ok=false;
    ok=await save(async db=>{
      const cref=db.collection("chantiers").doc();
      await cref.set({ident,entreprise:d.entreprise,nom:d.nom,adresse:d.adresse,mailChef:d.mail,debut:d.debut,fin:d.fin,logoId,createdAt:new Date().toISOString()});
      const pref=db.collection("postes").doc();
      await pref.set({chantierId:cref.id,role:"chef_chantier",nom:d.chefNom,prenom:d.chefPre,carte:"",mail:d.mail,codeHash:await hashCode(pref.id,code),statut:"attente",createdAt:new Date().toISOString()});
    },"Chantier créé");
    if(!ok)return;
    A.last={ident,code,chantierNom:d.nom,entreprise:d.entreprise,nom:d.chefNom,prenom:d.chefPre,mail:d.mail};A.prefill={};A.view="created";return drawAccueil();
  }
  if(a==="acc-login"){
    const ident=v("lgId").trim().toUpperCase(),nom=v("lgNom"),prenom=v("lgPrenom"),mail=v("lgMail").trim().toLowerCase(),code=v("lgCode");
    A.prefill={ident,nom,prenom,mail};
    if(!ident||!nom.trim()||!prenom.trim()||!mail||!code.trim())return fail("Remplissez tous les champs.");
    const ch=S.chantiers.find(c=>c.ident===ident);
    if(!ch)return fail("Identifiant de chantier inconnu.");
    const t=todayStr();
    if(t<ch.debut)return fail("Ce chantier n'est pas encore ouvert : début le "+dateLong(ch.debut)+".");
    if(t>ch.fin)return fail("Ce chantier est terminé : les accès sont fermés.");
    const p=S.postes.find(x=>x.chantierId===ch.id&&norm(x.mail)===norm(mail)&&norm(x.nom)===norm(nom)&&norm(x.prenom)===norm(prenom));
    if(!p)return fail("Aucun poste ne correspond à ces informations. Vérifiez auprès du chef de chantier.");
    if(p.statut==="suspendu")return fail("Accès suspendu par le chef de chantier.");
    if(p.statut==="fin_mission"||p.statut==="bloque")return fail("Accès à ce chantier retiré.");
    const other=S.postes.find(x=>x.chantierId!==ch.id&&norm(x.mail)===norm(mail)&&(x.statut==="actif"||x.statut==="suspendu"));
    if(other)return fail("Cette adresse est déjà rattachée à un autre chantier. Demandez au chef de ce chantier de mettre fin à votre mission.");
    if(!p.codeHash)return fail("Ce code a déjà été utilisé. Demandez un nouveau code par mail.");
    if(await hashCode(p.id,code)!==p.codeHash)return fail("Code incorrect.");
    if(p.statut==="attente"){
      pushMail({to:p.mail,objet:"Confirmez votre adresse",corps:"Bonjour "+p.prenom+", cliquez sur le lien pour confirmer votre adresse et activer votre accès au chantier "+ch.nom+".",action:{posteId:p.id}});
      A.view="mailbox";A.msg="Un mail de confirmation vient d'être envoyé (simulé). Ouvrez-le ci-dessous pour activer le compte.";return drawAccueil();
    }
    return finalizeLogin(p);
  }
  if(a==="acc-verify"){const m=S.mails[Number(el.dataset.i)];const p=m&&S.postes.find(x=>x.id===m.action.posteId);if(!p)return fail("Poste introuvable.");m.done=true;return finalizeLogin(p)}
  if(a==="acc-renew"){
    const ident=v("rnId").trim().toUpperCase(),mail=v("rnMail").trim().toLowerCase();A.prefill={ident,mail};
    if(!ident||!mail)return fail("Indiquez l'identifiant du chantier et votre adresse mail.");
    const ch=S.chantiers.find(c=>c.ident===ident);
    const p=ch&&S.postes.find(x=>x.chantierId===ch.id&&norm(x.mail)===norm(mail)&&(x.statut==="actif"||x.statut==="attente"));
    if(p){const code=genCode();const ok=await save(async db=>{await db.doc("postes/"+p.id).update({codeHash:await hashCode(p.id,code)})});
      if(!ok)return;pushMail({to:p.mail,objet:"Votre nouveau code",corps:"Voici votre nouveau code de connexion. L'ancien code n'est plus valable.",code})}
    A.view="mailbox";A.msg="Si l'adresse correspond à un poste, un nouveau code vient d'être envoyé (simulé ci-dessous).";return drawAccueil();
  }
  if(a==="acc-posteadd"){
    const s=S.session;const role=v("npRole"),nom=v("npNom").trim(),prenom=v("npPre").trim(),carte=v("npCarte").trim(),mail=v("npMail").trim().toLowerCase();
    if(!nom||!prenom||!mail)return fail("Nom, prénom et adresse mail sont obligatoires.");
    if(!okMail(mail))return fail("Adresse mail invalide.");
    if(S.postes.some(p=>p.chantierId===s.chantierId&&norm(p.mail)===norm(mail)))return fail("Cette adresse mail a déjà un poste sur ce chantier.");
    const rang=role==="grutier"?S.postes.filter(p=>p.chantierId===s.chantierId&&p.role==="grutier").length+1:null;
    const code=genCode();
    const ok=await save(async db=>{const pref=db.collection("postes").doc();
      await pref.set({chantierId:s.chantierId,role,rang,nom,prenom,carte,mail,codeHash:await hashCode(pref.id,code),statut:"attente",createdAt:new Date().toISOString()})},"Poste créé");
    if(!ok)return;
    A.codeShown={label:roleLabel({role,rang}),nom,prenom,code};A.newPoste=false;return drawAccueil();
  }
  if(a==="acc-pact"){
    const id=el.dataset.id,act=el.dataset.v;
    if(act==="fin"||act==="bloquer"){A.confirm={id,v:act};return drawAccueil()}
    return posteAct(id,act);
  }
  if(a==="acc-pconfirm"){const id=el.dataset.id,act=el.dataset.v;A.confirm=null;return posteAct(id,act)}
  if(a==="acc-pcancel"){A.confirm=null;return drawAccueil()}
}
async function posteAct(id,act){
  const p=S.postes.find(x=>x.id===id);if(!p)return;const A=S.acc;let code=null,data={};
  if(act==="suspendre")data={statut:"suspendu"};
  else if(act==="reactiver")data={statut:p.activeLe?"actif":"attente"};
  else if(act==="fin")data={statut:"fin_mission",quitteLe:todayStr(),codeHash:""};
  else if(act==="bloquer")data={statut:"bloque",quitteLe:todayStr(),codeHash:""};
  else if(act==="code"||act==="reintegrer"||act==="debloquer"){code=genCode();data={codeHash:await hashCode(p.id,code)};if(act!=="code"){data.statut="attente";data.quitteLe=null;data.activeLe=null}}
  const ok=await save(db=>db.doc("postes/"+id).update(data),"Poste mis à jour");
  if(!ok)return;
  if(code)A.codeShown={label:roleLabel(p),nom:p.nom,prenom:p.prenom,code};
  drawAccueil();
}

async function boot(){
  if(!window.claude||!window.claude.use){S.canWrite=false;S.loaded.t=true;render();return}
  const db=await window.claude.use("db");
  S.db=db;
  if(!db){S.canWrite=false;S.loaded.t=true;render();return}
  try{const u=await window.claude.use("user");S.user=u;
    if(u){S.isChef=(await u.isOwner())||(await u.canEdit());try{S.uid=await u.id()}catch(e){}
      const c=await u.can("data.write");S.canAsk=c!==false;}
    else{S.isChef=true;S.canAsk=true}
  }catch(e){S.isChef=true;S.canAsk=true}
  S.base={isChef:S.isChef,canAsk:S.canAsk,canWrite:S.isChef};
  try{S.session=JSON.parse(localStorage.getItem("cg-session")||"null")}catch(e){S.session=null}
  applyRole();
  window.claude.use("assets").then(a=>{S.assets=a;render()}).catch(()=>{});
  const map=snap=>snap.docs.map(d=>({id:d.id,...d.data()}));
  db.collection("taches").onSnapshot(s=>{S.taches=map(s);S.loaded.t=true;render()},()=>{S.loaded.t=true;render()});
  db.collection("journal").onSnapshot(s=>{S.journal=map(s);render()});
  db.collection("consignes").onSnapshot(s=>{S.consignes=map(s);render()});
  db.collection("recurrences").onSnapshot(s=>{S.recs=map(s);render()});
  db.collection("chantiers").onSnapshot(s=>{S.chantiers=map(s);render()});
  db.collection("postes").onSnapshot(s=>{S.postes=map(s);S.postesLoaded=true;checkSession();render()});
  let demInit=false;
  db.collection("demandes").onSnapshot(s=>{
    const prev=Object.fromEntries(S.demandes.map(d=>[d.id,d]));
    S.demandes=map(s);
    if(demInit){for(const ch of s.docChanges()){const d={id:ch.doc.id,...ch.doc.data()};
      if(ch.type==="added"&&d.statut==="attente"&&S.isChef)toast("Nouvelle demande de grue : "+d.nom+(d.equipe?" ("+d.equipe+")":""));
      if(ch.type==="modified"&&!S.isChef&&d.demandeurId&&d.demandeurId===S.uid&&prev[d.id]&&prev[d.id].statut!==d.statut)toast(d.statut==="acceptee"?"Votre demande « "+d.nom+" » est acceptée":"Votre demande « "+d.nom+" » est refusée");}}
    demInit=true;render();
  });
  db.collection("jours").onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data());S.jours=o;render()});
  db.doc("reglages/chantier").onSnapshot(s=>{S.reglages=s.exists?s.data():null;render()});
}
async function save(fn,okMsg,asker){

/* photo compression + upload */
async function uploadPhoto(file){
  if(!S.assets){toast("Ajout de photos indisponible ici");return null}
  let blob=file;
  try{
    const bmp=await createImageBitmap(file);const max=1600;const sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.78))||file;
  }catch(e){}
  try{const r=await S.assets.upload(blob);return r.id}catch(e){toast("Photo non envoyée : "+(e&&e.message||e.code||"erreur"));return null}
}

function chipsFor(it){
  const t=it.t;let c=`<span class="chip ${t.type}">${TYPE_LBL[t.type]||"Libre"}</span>`;
  if(t.statut==="termine")c+=`<span class="chip ok">Terminé</span>`;
  if(t.statut==="en_cours")c+=`<span class="chip run">En cours</span>`;
  if(it.conf&&!it.flags.some(f=>f.l==="Conflit"))c+=`<span class="chip bad">Conflit</span>`;
  for(const f of it.flags)c+=`<span class="chip ${f.c}">${esc(f.l)}</span>`;
  if(t.statut==="termine"){const s=toMin(t.debutReel),e=toMin(t.finReel);if(s!=null&&e!=null){const d=(e-s)-t.duree;if(Math.abs(d)>=5)c+=`<span class="chip ${d>0?"bad":"ok"}">${d>0?"+":"−"}${Math.abs(d)} min vs prévu</span>`}}
  if(t.recId){const r=S.recs.find(x=>x.id===t.recId);if(r)c+=`<span class="chip rec">Récurrent : ${esc(recLabel(r))}</span>`}
  if(t.consigneId){const cs=S.consignes.find(x=>x.id===t.consigneId);if(cs)c+=`<span class="chip">Consigne : ${esc(cs.materiel)}</span>`}
  if(t.photos&&t.photos.length)c+=`<span class="chip">${t.photos.length} photo${t.photos.length>1?"s":""}</span>`;
  if(t.reception&&t.reception.etat==="reserve")c+=`<span class="chip bad">Réserve à réception</span>`;
  if(t.reception&&t.reception.etat==="ok")c+=`<span class="chip ok">Réception OK</span>`;
  if(t.exemple)c+=`<span class="chip ex">Exemple</span>`;
  return c;
}

function renderJour(){
  const P=plan(S.date), R=reg(), M=P.M;
  const d0=P.W[0][0], d1=P.W[1][1], span=d1-d0;
  const pct=m=>((m-d0)/span*100).toFixed(2)+"%";
  const dispo=(P.W[0][1]-P.W[0][0])+(P.W[1][1]-P.W[1][0]);
  const used=P.items.reduce((a,it)=>a+(it.e-it.s),0);
  const done=P.items.filter(i=>i.t.statut==="termine").length;
  let h="";
  // strip
  h+=`<section class="strip" aria-label="Occupation de la grue"><div class="bar">`;
  h+=`<div class="pause" style="left:${pct(P.W[0][1])};width:calc(${pct(P.W[1][0])} - ${pct(P.W[0][1])})"></div>`;
  for(const it of P.items){const col=it.t.type==="fixe"?"var(--fixe)":it.t.type==="souple"?"var(--souple)":"var(--libre)";
    h+=`<div class="seg" title="${esc(it.t.nom)} ${fmt(it.s)}–${fmt(it.e)}" style="left:${pct(Math.max(d0,it.s))};width:calc(${pct(Math.min(d1,it.e))} - ${pct(Math.max(d0,it.s))});background:${col};opacity:${it.t.statut==="termine"?.45:1}"></div>`}
  if(isToday()){const n=nowMin();if(n>=d0&&n<=d1)h+=`<div class="now" style="left:${pct(n)}"></div>`}
  h+=`</div><div class="ticks">`;
  for(let m=Math.ceil(d0/60)*60;m<=d1;m+=60)h+=`<span style="left:${pct(m)}">${m/60}h</span>`;
  h+=`</div>`;
  h+=`<div class="kpis"><div class="kpi"><b>${P.items.length+P.unplaced.length}</b><span>demandes</span></div><div class="kpi"><b>${Math.round(used/dispo*100)}%</b><span>grue occupée sur ${dur(dispo)}</span></div><div class="kpi"><b>${dur(Math.max(0,dispo-used))}</b><span>grue disponible</span></div><div class="kpi"><b>${done}/${P.items.length}</b><span>opérations terminées</span></div></div>`;
  h+=`<div class="legend"><span>${q("types").replace('margin-left:8px','')}</span><span><i style="background:var(--fixe)"></i>Fixe : heure imposée</span><span><i style="background:var(--souple)"></i>Souple : dans une plage</span><span><i style="background:var(--libre)"></i>Libre : placée par l'outil</span><span>Marge entre opérations : ${M} min</span></div>${hbox("types")}</section>`;

  // pilotage
  if(isToday()&&S.canWrite){
    const rc=S.jours[S.date]?.recalc;
    h+=`<div class="alert inf"><h3>Pilotage en direct${q("pilotage")}</h3>${hbox("pilotage")}<div class="muted" style="font-size:14px">${rc?`Les opérations non fixes sont replacées à partir de <b class="mono">${esc(rc)}</b>.`:"Un retard ? Replacez les opérations souples et libres à partir de l'heure actuelle."}</div><div class="actions"><button class="btn dark" data-act="recalc" type="button">Recalculer depuis ${fmt(nowMin())}</button>${rc?`<button class="btn" data-act="recalc-off" type="button">Annuler le recalcul</button>`:""}</div></div>`;
  }
  // conflicts
  const seen=new Set();
  for(const c of P.conflicts){
    const key=[c.a.t.id,c.b.t.id].sort().join("|");if(seen.has(key))continue;seen.add(key);
    const A=c.a,B=c.b;
    const optB=P.slotFor(A.e+M,B.t.duree,B.t.id), delayB=optB==null?null:optB-B.s;
    const optA=A.kind==="fixe"?P.slotFor(B.e+M,A.t.duree,A.t.id):null, delayA=optA==null?null:optA-A.s;
    const recoA=delayA!=null&&(delayB==null||delayA<delayB);
    let opts="";
    if(optB!=null)opts+=`<div class="opt"><p><b>Option A</b>${!recoA?'<span class="reco">Recommandée</span>':""}<br>Garder « ${esc(A.t.nom)} » à ${fmt(A.s)}, décaler « ${esc(B.t.nom)} » à <b class="mono">${fmt(optB)}</b> (${dur(delayB)} plus tard)</p><button class="btn pri" data-act="shift" data-id="${B.t.id}" data-to="${fmt(optB)}" type="button">Appliquer</button></div>`;
    if(optA!=null)opts+=`<div class="opt"><p><b>Option B</b>${recoA?'<span class="reco">Recommandée</span>':""}<br>Garder « ${esc(B.t.nom)} » à ${fmt(B.s)}, décaler « ${esc(A.t.nom)} » à <b class="mono">${fmt(optA)}</b> (${dur(delayA)} plus tard)</p><button class="btn pri" data-act="shift" data-id="${A.t.id}" data-to="${fmt(optA)}" type="button">Appliquer</button></div>`;
    if(optA==null&&optB==null)opts+=`<div class="opt"><p>Aucun créneau libre aujourd'hui pour décaler l'une des deux opérations.</p></div>`;
    opts+=`<div class="opt"><p>Rendre « ${esc(B.t.nom)} » souple : l'outil la placera au mieux.</p><button class="btn" data-act="tosouple" data-id="${B.t.id}" type="button">Rendre souple</button></div>`;
    h+=`<div class="alert conf"><h3>Conflit de grue${q("conflit")}</h3>${hbox("conflit")}<div style="font-size:14px">« ${esc(A.t.nom)} » (${fmt(A.s)}–${fmt(A.e)}) et « ${esc(B.t.nom)} » (${fmt(B.s)}–${fmt(B.e)}) se chevauchent, marge de ${M} min comprise.</div><div class="opts">${opts}</div><div class="hint">Le chef de manœuvre valide : l'outil propose, il n'autorise aucun levage.</div></div>`;
  }
  if(P.unplaced.length){
    h+=`<div class="alert warn"><h3>En théorie, ne rentre pas dans la journée${q("nonplace")}</h3>${hbox("nonplace")}<div style="font-size:14px">Plus grand créneau libre restant : <b>${dur(Math.max(0,P.largestGap-M))}</b> d'un seul tenant (marge de ${M} min déduite).</div><div class="opts">${P.unplaced.map(t=>`<div class="opt"><p><b>${esc(t.nom)}</b> · ${dur(t.duree)}</p><div class="actions" style="margin:0">${S.canWrite?`<button class="btn pri" data-act="realise" data-id="${t.id}" type="button">Réalisé</button>`:""}<button class="btn" data-act="edittask" data-id="${t.id}" type="button">Modifier</button><button class="btn" data-act="tomorrow" data-id="${t.id}" type="button">Reporter au lendemain</button></div></div>`).join("")}</div></div>`;
  }
  if(P.realises.length){
    h+=`<div class="alert inf"><h3>Réalisé hors planning${q("realise")}</h3>${hbox("realise")}<div class="opts">${P.realises.map(t=>`<div class="opt"><p><b>${esc(t.nom)}</b> · ${dur(t.duree)} prévues<br><span class="muted" style="font-size:13px">Solution trouvée sur le terrain, heures non renseignées</span></p>${S.canWrite?`<div class="actions" style="margin:0"><button class="btn" data-act="open" data-id="${t.id}" type="button">Ajouter les heures</button><button class="btn" data-act="reset" data-id="${t.id}" type="button">Annuler</button></div>`:""}</div>`).join("")}</div></div>`;
  }
  // timeline
  if(!P.items.length&&!P.unplaced.length){
    h+=`<div class="empty"><h3 style="font-size:20px">Aucune demande de grue ce jour</h3><p class="muted">Ajoutez la première avec le bouton « + Demande grue » : livraison, bétonnage, rotation de banches…</p></div>`;
    return h;
  }
  h+=`<section class="tl" aria-label="Chorégraphie de la journée">`;
  let cur=d0, pauseDone=false;
  const pauseRow=()=>`<div class="row"><div class="time">${fmt(P.W[0][1])}<small>${fmt(P.W[1][0])}</small></div><div class="pauserow">Pause, grue à l'arrêt</div></div>`;
  const gapRow=(a,b)=>b-a>M?`<div class="row"><div class="time">${fmt(a)}</div><div class="gap">Grue disponible ${dur(b-a)}, jusqu'à ${fmt(b)}</div></div>`:"";
  for(const it of P.items){
    if(!pauseDone&&it.s>=P.W[1][0]){h+=gapRow(cur,P.W[0][1]);h+=pauseRow();pauseDone=true;cur=Math.max(cur,P.W[1][0])}
    h+=gapRow(cur,it.s);
    const t=it.t;
    const cls=[t.type||"libre",t.statut==="termine"?"done":"",t.statut==="en_cours"?"encours":""].join(" ");
    const zone=(t.zoneDe||t.zoneVers)?` · ${esc(t.zoneDe||"?")} → ${esc(t.zoneVers||"?")}`:"";
    let acts="";
    if(S.canWrite){
      if(t.statut!=="termine"&&t.statut!=="en_cours")acts=`<button class="btn pri" data-act="start" data-id="${t.id}" type="button">Démarrer</button>`;
      if(t.statut==="en_cours")acts=`<button class="btn pri" data-act="end" data-id="${t.id}" type="button">Terminer</button>`;
    }
    acts+=`<button class="btn" data-act="open" data-id="${t.id}" type="button">Détails, photos</button>`;
    const sub=t.type==="fixe"&&t.statut!=="termine"?"imposé":t.type==="souple"&&t.statut!=="termine"?`plage ${esc(t.heure||"")}–${esc(t.fenFin||"")}`:"";
    h+=`<div class="row"><div class="time">${fmt(it.s)}<small>${fmt(it.e)}</small></div><div class="card ${cls}"><div class="t">${esc(t.nom)}<span class="muted mono" style="font-size:12.5px;font-weight:500">${dur(it.e-it.s)}${t.statut==="termine"?" réel":""}</span></div><div class="meta">${esc(t.equipe||"Équipe non précisée")}${zone}${sub?` · ${sub}`:""}</div>${t.notes?`<div class="meta" style="color:var(--ink)">${esc(t.notes)}</div>`:""}<div class="chips">${chipsFor(it)}</div>${M&&t.statut!=="termine"?`<div class="marge">+ ${M} min de marge, jusqu'à ${fmt(it.e+M)}</div>`:""}<div class="actions">${acts}</div></div></div>`;
    cur=Math.max(cur,it.e+(t.statut==="termine"?0:M));
    if(!pauseDone&&cur>=P.W[0][1]&&cur<P.W[1][0]){h+=pauseRow();pauseDone=true;cur=P.W[1][0]}
  }
  if(!pauseDone){h+=gapRow(cur,P.W[0][1]);h+=pauseRow();cur=P.W[1][0]}
  h+=gapRow(cur,P.W[1][1]);
  h+=`<div class="row"><div class="time">${fmt(P.W[1][1])}</div><div class="pauserow" style="background:var(--surface-2)">Fin de journée grue</div></div></section>`;
  return h;
}

const DEM_FIELDS=["nom","modele","type","heure","fenFin","duree","equipe","zoneDe","zoneVers","consigneId","notes"];
function demFields(d){const o={};for(const k of DEM_FIELDS)o[k]=d[k]??"";o.duree=Number(d.duree)||30;return o}
function previewSlot(d){
  const tmp={...demFields(d),id:"__prev",date:d.date,statut:"a_faire",createdAt:"zzzz"};
  S.taches.push(tmp);let P;try{P=plan(d.date)}finally{S.taches.pop()}
  const it=P.items.find(i=>i.t.id==="__prev");
  if(!it)return {bad:true,txt:"Ne rentre pas dans la journée en l'état"};
  const c=P.conflicts.find(c=>c.a.t.id==="__prev"||c.b.t.id==="__prev");
  if(c){const o=c.a.t.id==="__prev"?c.b:c.a;return {bad:true,txt:`Conflit avec « ${o.t.nom} » (${fmt(o.s)}–${fmt(o.e)})`}}
  const fl=it.flags.map(f=>f.l).join(", ");
  return {bad:!!fl,txt:`Créneau si acceptée : ${fmt(it.s)}–${fmt(it.e)}${fl?" · "+fl:""}`};
}
let namesPending=false;
function nameOf(id){if(!id)return "";if(S.names[id]!==undefined)return S.names[id];
  if(S.user&&!namesPending){namesPending=true;const ids=[...new Set(S.demandes.map(d=>d.demandeurId).filter(Boolean))];
    S.user.profiles(ids).then(ps=>{for(const i of ids)S.names[i]=(ps[i]&&ps[i].name)||"";namesPending=false;render()}).catch(()=>{for(const i of ids)S.names[i]="";namesPending=false})}
  return "";}
function horaire(d){return d.type==="fixe"?`à ${esc(d.heure||"?")}`:d.type==="souple"?`entre ${esc(d.heure||"?")} et ${esc(d.fenFin||"?")}`:"sans heure précise"}
function demCard(d,chef){
  const st={attente:'<span class="chip run">En attente</span>',acceptee:'<span class="chip ok">Acceptée</span>',refusee:'<span class="chip bad">Refusée</span>'}[d.statut]||"";

  if(d.statut==="acceptee"&&d.tacheId){const t=S.taches.find(x=>x.id===d.tacheId);const P=t?plan(t.date):null;const it=P&&P.items.find(i=>i.t.id===t.id);if(it)h+=`<div class="preview">Prévue de ${fmt(it.s)} à ${fmt(it.e)}</div>`}

      if(S.refusing===d.id)h+=`<div class="fld"><label for="motif-${d.id}">Motif du refus (visible par le demandeur)</label><input id="motif-${d.id}" placeholder="Ex. : grue prise par le béton, voir demain 7h30"></div><div class="actions"><button class="btn danger" data-act="refuseok" data-id="${d.id}" type="button">Confirmer le refus</button><button class="btn" data-act="refuseno" type="button">Annuler</button></div>`;
      else h+=`<div class="actions"><button class="btn pri" data-act="accept" data-id="${d.id}" type="button">Accepter</button><button class="btn" data-act="acceptedit" data-id="${d.id}" type="button">Modifier puis accepter</button><button class="btn" data-act="refuse" data-id="${d.id}" type="button">Refuser</button></div>`;
    }
  }
  return h+`</div>`;
}
function renderDemandes(){
  let h=`<h2 class="page">Demandes de grue${q("demandes")}</h2>${hbox("demandes")}`;
  if(S.isChef){
    const att=S.demandes.filter(d=>d.statut==="attente").sort((a,b)=>(a.date+(a.createdAt||"")).localeCompare(b.date+(b.createdAt||"")));
    h+=`<p class="muted" style="margin:4px 0 0">${att.length?att.length+" demande"+(att.length>1?"s":"")+" en attente de votre décision.":"Aucune demande en attente."}</p>`;
    if(!att.length)h+=`<div class="empty">Les chefs d'équipe envoient leurs demandes depuis leur téléphone. Elles arrivent ici, sans toucher au planning tant que vous ne les acceptez pas.</div>`;
    else h+=`<div class="list">${att.map(d=>demCard(d,true)).join("")}</div>`;
    const done=S.demandes.filter(d=>d.statut!=="attente").sort((a,b)=>(b.traiteeLe||"").localeCompare(a.traiteeLe||"")).slice(0,15);
    if(done.length)h+=`<h3 style="font-size:19px;margin-top:20px">Déjà traitées</h3><div class="list">${done.map(d=>demCard(d,false)).join("")}</div>`;
  } else {
    if(S.canAsk)h+=`<div class="actions"><button class="btn pri" data-act="ask" type="button">+ Demander la grue</button></div>`;
    const mine=S.demandes.filter(d=>!S.uid||d.demandeurId===S.uid).sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""));

  }

}
async function acceptDemande(id,data){

function renderBilan(){
  const R=reg(), P=plan(S.date);
  const dispo=(P.W[0][1]-P.W[0][0])+(P.W[1][1]-P.W[1][0]);
  const day=S.taches.filter(t=>t.date===S.date);
  const done=day.filter(t=>t.statut==="termine"&&toMin(t.debutReel)!=null&&toMin(t.finReel)!=null);
  const reel=done.reduce((a,t)=>a+(toMin(t.finReel)-toMin(t.debutReel)),0);
  const prev=done.reduce((a,t)=>a+t.duree,0);
  const late=done.filter(t=>(toMin(t.finReel)-toMin(t.debutReel))-t.duree>=5);
  let h=`<h2 class="page">Bilan du jour</h2>`;
  h+=`<div class="kpis"><div class="kpi"><b>${dur(reel)}</b><span>grue réellement utilisée</span></div><div class="kpi"><b>${dispo?Math.round(reel/dispo*100):0}%</b><span>taux d'utilisation réel</span></div><div class="kpi"><b>${reel-prev>0?"+":""}${reel-prev} min</b><span>écart réel / prévu</span></div><div class="kpi"><b>${late.length}</b><span>opérations plus longues que prévu</span></div></div>`;
  if(done.length){
    h+=`<div class="sec"><h3>Prévu / réel</h3><div class="tw"><table class="t"><thead><tr><th>Opération</th><th>Prévu</th><th>Réel</th><th>Écart</th></tr></thead><tbody>`;
    for(const t of done){const r=toMin(t.finReel)-toMin(t.debutReel),e=r-t.duree;h+=`<tr><td>${esc(t.nom)}</td><td class="mono">${t.duree} min</td><td class="mono">${r} min</td><td class="mono ${e>=5?"pos":e<=-5?"neg":""}">${e>0?"+":""}${e} min</td></tr>`}
    h+=`</tbody></table></div></div>`;
  } else h+=`<div class="empty">Aucune opération terminée ce jour. Utilisez « Démarrer » puis « Terminer » sur la chorégraphie pour mesurer les temps réels.</div>`;
  // learning
  const L=learning().filter(o=>o.n>=2);
  h+=`<div class="sec"><h3>Ce que le chantier apprend${q("apprendre")}</h3>${hbox("apprendre")}<p class="muted" style="margin:0 0 6px;font-size:14px">Durées moyennes mesurées sur toutes les journées, à partir de 2 opérations du même type.</p>`;
  if(!L.length)h+=`<p class="muted" style="margin:0">Pas encore assez de mesures.</p>`;
  else{h+=`<div class="list">`;for(const o of L.sort((a,b)=>Math.abs(b.ecart)-Math.abs(a.ecart))){const cur=suggestedDur(o.k),prop=Math.round(o.reel/5)*5;
    h+=`<div class="item"><div class="h"><b>${esc(tpl(o.k).n)}</b><span class="mono ${o.ecart>=5?"pos":o.ecart<=-5?"neg":""}">${o.ecart>0?"+":""}${Math.round(o.ecart)} min en moyenne</span></div><p class="muted" style="font-size:13.5px">${o.n} mesures · prévu ${Math.round(o.prev)} min · réel ${Math.round(o.reel)} min · durée par défaut actuelle ${cur} min</p>${Math.abs(prop-cur)>=5&&S.canWrite?`<div class="sugg"><span>Prévoir <b>${prop} min</b> pour les prochaines fois</span><button class="btn pri" data-act="applydur" data-k="${o.k}" data-v="${prop}" type="button">Appliquer</button></div>`:""}</div>`}
    h+=`</div>`}
  h+=`</div>`;
  // journal
  const J=S.journal.filter(j=>j.date===S.date).sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""));
  h+=`<div class="sec"><h3>Journal d'expérience${q("journal")}</h3>${hbox("journal")}`;
  if(S.canWrite)h+=`<div class="fld"><label for="jText">Ce qui s'est passé, ce qu'il faut améliorer</label><textarea id="jText" placeholder="Ex. : camion ferraille mal positionné, prévoir un guidage à l'entrée"></textarea></div><div class="actions"><button class="btn pri" data-act="addjournal" type="button">Ajouter au journal</button></div>`;
  if(!J.length)h+=`<p class="muted">Aucun commentaire ce jour.</p>`;
  else h+=`<div class="list">${J.map(j=>{const t=S.taches.find(x=>x.id===j.tacheId);return `<div class="item"><div class="h"><span class="lbl">${esc(j.heure||"")}${t?" · "+esc(t.nom):""}</span>${j.exemple?'<span class="chip ex">Exemple</span>':""}</div><p>${esc(j.texte)}</p>${photoGrid(j.photos)}</div>`}).join("")}</div>`;
  h+=`</div>`;
  return h;
}
