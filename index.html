  // réception
  const rc=t.reception||{};
  h+=`<div class="sec"><h3>État des lieux à réception${q("reception")}</h3>${hbox("reception")}<div class="seg2"><button type="button" data-act="recep" data-v="ok" aria-pressed="${rc.etat==="ok"}" ${S.canWrite?"":"disabled"}>Conforme</button><button type="button" data-act="recep" data-v="reserve" aria-pressed="${rc.etat==="reserve"}" ${S.canWrite?"":"disabled"}>Avec réserve</button></div><div class="fld"><label for="dRecNote">Constat</label><input id="dRecNote" value="${esc(rc.note||"")}" placeholder="Ex. : 2 barres HA12 tordues, palette filmée abîmée" ${S.canWrite?"":"disabled"}></div>${S.canWrite?`<div class="actions"><button class="btn" data-act="saverecep" data-id="${id}" type="button">Enregistrer le constat</button></div>`:""}<div class="hint">Ajoutez une photo « État à réception » ci-dessous pour garder la preuve.</div></div>`;
  // photos
  h+=`<div class="sec"><h3>Photos</h3>${photoGrid(t.photos)||'<p class="muted" style="margin:0">Bon de livraison, état du matériel, accroche… Rien pour l\'instant.</p>'}`;
  if(S.canWrite&&S.assets)h+=photoAdder("t");
  else if(S.canWrite)h+=`<p class="hint">L'ajout de photos n'est pas disponible dans cette vue.</p>`;
  h+=`</div>`;
  // comments
  const J=S.journal.filter(j=>j.tacheId===id).sort((a,b)=>(a.createdAt||"").localeCompare(b.createdAt||""));
  h+=`<div class="sec"><h3>Commentaires</h3>${J.length?`<div class="list">${J.map(j=>`<div class="item"><span class="lbl">${esc(j.heure||"")}</span><p>${esc(j.texte)}</p></div>`).join("")}</div>`:'<p class="muted" style="margin:0">À améliorer, à retenir pour la prochaine fois.</p>'}`;
  if(S.canWrite)h+=`<div class="fld"><label for="dCom">Nouveau commentaire</label><textarea id="dCom" placeholder="Ex. : prévoir 15 min de plus, accès zone B encombré"></textarea></div><div class="actions"><button class="btn pri" data-act="addcom" data-id="${id}" type="button">Ajouter</button></div>`;
  h+=`</div>`;
  if(S.canWrite)h+=`<div class="actions" style="margin-top:14px">${confirmDel?`<span style="align-self:center">${t.recId?"Retirer cette opération de ce jour seulement ? La série continue.":"Supprimer définitivement cette demande ?"}</span><button class="btn danger" data-act="delyes" data-id="${id}" type="button">Oui, supprimer</button><button class="btn" data-act="delno" type="button">Annuler</button>`:`<button class="btn danger" data-act="del" type="button">${t.recId?"Retirer de ce jour":"Supprimer la demande"}</button>`}</div>`;
  openSheet(h);
}
function photoAdder(ctx){
  return `<div class="addph"><div class="fld"><label for="phCat">Catégorie</label><select id="phCat">${PHOTO_CATS.map(c=>`<option>${c}</option>`).join("")}</select></div><div class="fld"><label for="phLeg">Légende</label><input id="phLeg" placeholder="Facultatif"></div><label class="btn pri filebtn">Prendre / ajouter une photo<input type="file" accept="image/*" capture="environment" id="phFile" data-ctx="${ctx}"></label></div>`;
}

let consEdit=null;
function consigneForm(c){
  consEdit=c?{...c}:{materiel:"",accessoire:"",texte:"",photos:[]};
  const isNew=!c;
  let h=`<header><h2>${isNew?"Nouvelle consigne":"Consigne : "+esc(c.materiel)}</h2><button class="btn" data-act="close" type="button">Fermer</button></header><div class="sec">`;
  h+=`<div class="fld"><label for="cMat">Matériel</label><input id="cMat" value="${esc(consEdit.materiel)}" placeholder="Ex. : Banches métalliques 2,70 m"></div>`;
  h+=`<div class="fld"><label for="cAcc">Accessoire de levage</label><input id="cAcc" value="${esc(consEdit.accessoire)}" placeholder="Ex. : élingue chaîne 2 brins, sangle textile 2 t"></div>`;
  h+=`<div class="fld"><label for="cTxt">Consigne</label><textarea id="cTxt" placeholder="Comment accrocher, points de levage, précautions">${esc(consEdit.texte)}</textarea></div>`;
  h+=`<div class="actions"><button class="btn pri" data-act="savecons" data-new="${isNew?1:0}" type="button">Enregistrer</button></div></div>`;
  if(!isNew){h+=`<div class="sec"><h3>Photos de référence</h3>${photoGrid(c.photos)||'<p class="muted" style="margin:0">Photo de l\'accroche correcte, de l\'étiquette de l\'élingue…</p>'}${S.assets?photoAdder("c"):""}</div>`;
    h+=`<div class="actions" style="margin-top:12px">${confirmDel?`<button class="btn danger" data-act="consdelyes" data-id="${c.id}" type="button">Oui, supprimer</button><button class="btn" data-act="consdelno" type="button">Annuler</button>`:`<button class="btn danger" data-act="consdel" type="button">Supprimer la consigne</button>`}</div>`}
  openSheet(h);
}

function reglagesForm(){
  const R=reg();if(S.moisSel===undefined)S.moisSel=[...((S.reglages&&S.reglages.moisActifs)||[])];
  let h=`<header><h2>Réglages du chantier</h2><button class="btn" data-act="close" type="button">Fermer</button></header><div class="sec"><h3>Horaires de la grue</h3><div class="two"><div class="fld"><label for="rDeb">Début</label><input id="rDeb" type="time" value="${R.debut}"></div><div class="fld"><label for="rFin">Fin</label><input id="rFin" type="time" value="${R.fin}"></div><div class="fld"><label for="rPd">Début de pause</label><input id="rPd" type="time" value="${R.pauseDebut}"></div><div class="fld"><label for="rPf">Reprise</label><input id="rPf" type="time" value="${R.pauseFin}"></div></div><div class="fld"><label for="rMarge">Marge entre deux opérations (min)</label><input id="rMarge" type="number" min="0" step="5" value="${R.marge}"></div><div class="hint">La marge absorbe les petits retards pour éviter l'effet domino.</div><div class="actions"><button class="btn pri" data-act="savereg" type="button">Enregistrer</button></div></div>`;
  h+=`<div class="sec"><h3>Opérations récurrentes${q("recurrence")}</h3>${hbox("recurrence")}<div class="actions" style="margin-top:0"><button class="btn pri" data-act="newrec" type="button">+ Opération récurrente</button></div><div class="fld"><label>Mois actifs pour toutes les séries (aucun choisi : toute l'année)</label><div class="tpls">${MOIS.map((n,i)=>`<button type="button" data-act="moisg" data-k="${i+1}" aria-pressed="${(S.moisSel||[]).includes(i+1)}">${n}</button>`).join("")}</div></div><div class="actions"><button class="btn" data-act="moisg-apply" type="button">Appliquer à toutes les séries</button></div>`;
  if(!S.recs.length)h+=`<p class="muted" style="margin:0">Aucune série. Créez-en une avec « + Demande grue », puis « Se répète ».</p>`;
  else h+=`<div class="list">${[...S.recs].sort((a,b)=>(a.heure||"").localeCompare(b.heure||"")).map(r=>`<div class="item"><div class="h"><b>${esc(r.nom)}</b><span class="chip ${r.type}">${TYPE_LBL[r.type]||"Libre"}</span></div><p class="muted" style="font-size:13.5px">${esc(recLabel(r))}${r.heure?" · "+esc(r.heure):""} · ${r.duree} min${r.fin?" · jusqu'au "+esc(dateLong(r.fin)):""}${r.exemple?" · Exemple":""}</p>${S.canWrite?`<div class="actions"><button class="btn" data-act="editserie" data-k="${r.id}" type="button">Modifier</button>${r.fin?`<button class="btn" data-act="resumeserie" data-k="${r.id}" type="button">Reprendre</button>`:`<button class="btn" data-act="stopserie" data-k="${r.id}" type="button">Arrêter</button>`}</div>`:""}</div>`).join("")}</div>`;
  h+=`</div>`;
  const nEx=S.demandes.filter(d=>d.exemple).length+S.recs.filter(r=>r.exemple).length+S.taches.filter(t=>t.exemple).length+S.journal.filter(j=>j.exemple).length+S.consignes.filter(c=>c.exemple).length;
  if(nEx)h+=`<div class="sec"><h3>Données d'exemple</h3><p class="muted" style="margin:0 0 8px">${nEx} éléments marqués « Exemple » ont été ajoutés pour montrer l'outil.</p>${confirmDel?`<button class="btn danger" data-act="clearexyes" type="button">Oui, tout effacer</button> <button class="btn" data-act="clearexno" type="button">Annuler</button>`:`<button class="btn danger" data-act="clearex" type="button">Effacer les exemples</button>`}</div>`;
  h+=`<div class="sec"><h3>Rappel sécurité</h3><p style="margin:0;font-size:14px">Cet outil organise l'ordre d'utilisation de la grue. Chaque levage reste validé sur place par le chef de manœuvre et le grutier : charge, accessoires, balisage, vent.</p></div>`;
  openSheet(h);
}

/* ---------- events ---------- */
document.getElementById("prevDay").onclick=()=>{S.date=addDays(S.date,-1);render()};
document.getElementById("nextDay").onclick=()=>{S.date=addDays(S.date,1);render()};
document.getElementById("goToday").onclick=()=>{S.date=todayStr();render()};
document.getElementById("fab").onclick=()=>{taskForm(null);if(!S.canWrite){F._mode="ask";drawTaskForm()}};
document.getElementById("btnAccueil").onclick=()=>{S.acc={view:"home"};drawAccueil()};
document.getElementById("btnReglages").onclick=()=>{confirmDel=false;S.moisSel=undefined;reglagesForm()};
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render();window.scrollTo(0,0)});

document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act, id=el.dataset.id;
  if(a==="closebg"){if(e.target===el)closeSheet();return}
  if(a.startsWith("acc-")){await accAction(a,el);return}
  if(a==="close"){closeSheet();openId=null;return}
  if(a==="zoom"){const lb=document.createElement("div");lb.className="lightbox";lb.innerHTML=`<img src="${blobUrl(el.dataset.src)}" alt=""><p>${esc(el.dataset.cap)}</p><button class="btn" type="button">Fermer</button>`;lb.onclick=()=>lb.remove();document.body.appendChild(lb);return}
  if(a==="help"){const k=el.dataset.k;S.help[k]=!S.help[k];
    if(layer.querySelector("[data-acc]")){drawAccueil()}
    else if(layer.querySelector("#fNom")){readForm();drawTaskForm()}
    else if(layer.querySelector("#rDeb"))reglagesForm();
    else if(layer.innerHTML&&openId)detail(openId);
    else render();
    return}
  if(a==="open"){confirmDel=false;detail(id);return}
  if(a==="start"){await updTache(id,{statut:"en_cours",debutReel:fmt(nowMin())},"Opération démarrée");return}
  if(a==="end"){const t=findT(id);await updTache(id,{statut:"termine",finReel:fmt(nowMin()),debutReel:t.debutReel||fmt(nowMin())},"Opération terminée");return}
  if(a==="recalc"){await save(db=>db.doc("jours/"+S.date).set({recalc:fmt(nowMin())}),"Journée recalculée");return}
  if(a==="recalc-off"){await save(db=>db.doc("jours/"+S.date).set({recalc:null}),"Recalcul annulé");return}
  if(a==="shift"){await updTache(id,{heure:el.dataset.to},"Opération décalée à "+el.dataset.to);return}
  if(a==="tosouple"){const t=findT(id);const r=reg();await updTache(id,{type:"souple",heure:t.heure||r.debut,fenFin:r.fin},"Opération rendue souple");return}
  if(a==="tomorrow"){const t=findT(id);await updTache(id,{date:addDays(t.date,1),statut:"a_faire",debutReel:null,finReel:null},"Reportée au lendemain");closeSheet();return}
  if(a==="applydur"){const r=reg();const d={...r.durees,[el.dataset.k]:Number(el.dataset.v)};await save(db=>db.doc("reglages/chantier").set({...(S.reglages||{}),durees:d}),"Durée par défaut mise à jour");return}
  if(a==="addjournal"){const tx=document.getElementById("jText").value.trim();if(!tx){toast("Écrivez un commentaire d'abord");return}
    await save(db=>db.collection("journal").add({date:S.date,heure:fmt(nowMin()),texte:tx,createdAt:new Date().toISOString(),photos:[]}),"Ajouté au journal");return}
  // task form
  if(a==="tpl"){readForm();const x=tpl(el.dataset.k);F.modele=x.k;F.nom=x.k==="autre"?F.nom:x.n;F.type=x.type;F.duree=suggestedDur(x.k);if(x.eq)F.equipe=x.eq;drawTaskForm();return}
  if(a==="type"){readForm();F.type=el.dataset.k;if(F.type==="souple"&&!F.fenFin)F.fenFin=reg().pauseDebut;drawTaskForm();return}
  if(a==="usedur"){readForm();F.duree=Number(el.dataset.v);drawTaskForm();return}
  if(a==="savetask"){readForm();if(!F.nom){toast("Donnez un intitulé à l'opération");return}
    if(F.type==="fixe"&&!F.heure){toast("Indiquez l'heure imposée");return}
    const data={nom:F.nom,modele:F.modele,type:F.type,heure:F.heure||"",fenFin:F.type==="souple"?(F.fenFin||""):"",duree:F.duree,equipe:F.equipe||"",zoneDe:F.zoneDe||"",zoneVers:F.zoneVers||"",consigneId:F.consigneId||"",notes:F.notes||""};
    if(F._mode==="ask"){Object.assign(data,{date:S.date,statut:"attente",demandeurId:S.uid||"",createdAt:new Date().toISOString()});
      if(await save(db=>db.collection("demandes").add(data),"Demande envoyée au chef de manœuvre",true)){closeSheet();S.tab="demandes";render()}return}
    if(F._mode==="fromDem"){if(await acceptDemande(F.demId,data))closeSheet();return}
    if(F._mode==="serie"||(F._mode==="new"&&F.rep)){
      const fr=F.freq||"semaine";
      if(!recValid(F)){toast(fr==="heure"?"Indiquez l'heure de la première opération":fr==="mois"?"Choisissez un jour de la semaine":"Choisissez au moins un jour");return}
      const debut=F.recDebut||S.date;if(F.recFin&&F.recFin<debut){toast("La date de fin doit suivre la date de début");return}
      Object.assign(data,{freq:fr,intervalle:Math.max(1,Number(F.intervalle)||1),modeMois:F.modeMois||"date",jourMois:F.jourMois||1,nth:Number(F.nth)||1,moisAnnee:[...(F.moisAnnee||[])].sort((x,y)=>x-y),jours:(fr==="heure"||fr==="jour"||(fr==="mois"&&F.modeMois!=="nth"))?[]:[...F.jours].sort(),fin:F.recFin||"",debut});
      if(F._mode==="serie"){if(await save(db=>db.doc("recurrences/"+F.serieId).update(data),"Série modifiée"))closeSheet()}
      else{Object.assign(data,{exceptions:[],createdAt:new Date().toISOString()});if(await save(db=>db.collection("recurrences").add(data),"Série créée : "+recLabel(data)))closeSheet()}
      return}
    if(F._mode==="new"){Object.assign(data,{date:S.date,statut:"a_faire",photos:[],createdAt:new Date().toISOString()});if(await save(db=>db.collection("taches").add(data),"Demande ajoutée"))closeSheet()}
    else{const oid=F.id;if(await updTache(oid,data,"Demande modifiée"))detail(openId&&openId!==oid?openId:(String(oid).startsWith("r:")?recNid(F.recId,F.recDate||F.date):oid))}
    return}
  if(a==="edittask"){const t=findT(id);F={...t,_mode:"edit"};drawTaskForm();return}
  if(a==="rep"){readForm();F.rep=el.dataset.v==="1";drawTaskForm();return}
  if(a==="jour"){readForm();const d=Number(el.dataset.k);if(F.freq==="mois")F.jours=[d];else F.jours=F.jours.includes(d)?F.jours.filter(x=>x!==d):[...F.jours,d];drawTaskForm();return}
  if(a==="freq"){readForm();F.freq=el.dataset.v;if(F.freq==="heure"){F.type="fixe";if(!F.heure)F.heure="08:00"}if(F.freq==="mois"&&F.modeMois==="nth"&&F.jours.length!==1)F.jours=[wday(F.recDebut||S.date)];drawTaskForm();return}
  if(a==="modemois"){readForm();F.modeMois=el.dataset.v;if(F.modeMois==="nth"&&F.jours.length!==1)F.jours=[wday(F.recDebut||S.date)];drawTaskForm();return}
  if(a==="jm-dernier"){readForm();F.jourMois=F.jourMois==="dernier"?Number((F.recDebut||S.date).slice(8)):"dernier";drawTaskForm();return}
  if(a==="mois-an"){readForm();const m=Number(el.dataset.k);F.moisAnnee=(F.moisAnnee||[]).includes(m)?F.moisAnnee.filter(x=>x!==m):[...(F.moisAnnee||[]),m];drawTaskForm();return}
  if(a==="newrec"){taskForm(null);F.rep=true;drawTaskForm();return}
  if(a==="moisg"){const m=Number(el.dataset.k);S.moisSel=S.moisSel.includes(m)?S.moisSel.filter(x=>x!==m):[...S.moisSel,m];reglagesForm();return}
  if(a==="moisg-apply"){await save(db=>db.doc("reglages/chantier").set({...(S.reglages||{}),moisActifs:[...S.moisSel].sort((x,y)=>x-y)}),S.moisSel.length?"Filtre de mois appliqué à toutes les séries":"Toutes les séries reprennent toute l'année");return}
  if(a==="ouvres"){readForm();F.jours=[1,2,3,4,5];drawTaskForm();return}
  if(a==="editserie"){serieForm(el.dataset.k);return}
  if(a==="stopserie"){const r=S.recs.find(x=>x.id===el.dataset.k);await save(db=>db.doc("recurrences/"+r.id).update({fin:todayStr()}),"Série arrêtée après aujourd'hui");if(layer.querySelector("#rDeb"))reglagesForm();return}
  if(a==="resumeserie"){await save(db=>db.doc("recurrences/"+el.dataset.k).update({fin:""}),"Série reprise");if(layer.querySelector("#rDeb"))reglagesForm();return}
  // detail
  if(a==="savereel"){const d=document.getElementById("dDeb").value,f=document.getElementById("dFin").value;const st=f?"termine":d?"en_cours":"a_faire";await updTache(id,{debutReel:d||null,finReel:f||null,statut:st},"Heures enregistrées");return}
  if(a==="ask"){taskForm(null);F._mode="ask";drawTaskForm();return}
  if(a==="accept"){await acceptDemande(id);return}
  if(a==="acceptedit"){const d=S.demandes.find(x=>x.id===id);F={...demFields(d),_mode:"fromDem",demId:id};drawTaskForm();return}
  if(a==="refuse"){S.refusing=id;render();return}
  if(a==="refuseno"){S.refusing=null;render();return}
  if(a==="refuseok"){const m=(document.getElementById("motif-"+id)||{}).value||"";S.refusing=null;await save(db=>db.doc("demandes/"+id).update({statut:"refusee",motif:m.trim(),traiteeLe:new Date().toISOString()}),"Demande refusée");return}
  if(a==="realise"){await updTache(id,{statut:"termine",horsPlanning:true,debutReel:null,finReel:null},"Marqué réalisé, retiré du planning");return}
  if(a==="reset"){await updTache(id,{statut:"a_faire",debutReel:null,finReel:null},"Remise à faire");return}
  if(a==="recep"){const t=findT(openId);const note=document.getElementById("dRecNote").value.trim();await updTache(openId,{reception:{etat:el.dataset.v,note,heure:fmt(nowMin())}},"Réception enregistrée");return}
  if(a==="saverecep"){const t=findT(id);const note=document.getElementById("dRecNote").value.trim();await updTache(id,{reception:{etat:(t.reception&&t.reception.etat)||"ok",note,heure:fmt(nowMin())}},"Constat enregistré");return}
  if(a==="addcom"){const tx=document.getElementById("dCom").value.trim();if(!tx)return;
    await save(async db=>{const rid=await real(id);const t=findT(rid);await db.collection("journal").add({date:t.date,tacheId:rid,heure:fmt(nowMin()),texte:tx,createdAt:new Date().toISOString(),photos:[]})},"Commentaire ajouté");if(openId)detail(openId);return}
  if(a==="del"){confirmDel=true;detail(openId);return}
  if(a==="delno"){confirmDel=false;detail(openId);return}
  if(a==="delyes"){confirmDel=false;const t=findT(id);if(await save(async db=>{
      if(t&&t.recId){const r=S.recs.find(x=>x.id===t.recId);if(r)await db.doc("recurrences/"+r.id).update({exceptions:[...(r.exceptions||[]),t.recDate||t.date]})}
      if(!String(id).startsWith("r:"))await db.doc("taches/"+id).delete();
    },t&&t.recId?"Retirée de ce jour":"Demande supprimée")){closeSheet();openId=null}return}
  // consignes
  if(a==="newconsigne"){confirmDel=false;consigneForm(null);return}
  if(a==="editconsigne"){confirmDel=false;consigneForm(S.consignes.find(c=>c.id===id));return}
  if(a==="savecons"){const m=document.getElementById("cMat").value.trim();if(!m){toast("Indiquez le matériel");return}
    const data={materiel:m,accessoire:document.getElementById("cAcc").value.trim(),texte:document.getElementById("cTxt").value.trim()};
    if(el.dataset.new==="1"){let ref=null;if(await save(async db=>{ref=await db.collection("consignes").add({...data,photos:[],createdAt:new Date().toISOString()})},"Consigne ajoutée")){consigneForm({id:ref.id,...data,photos:[]})}}
    else{await save(db=>db.doc("consignes/"+consEdit.id).update(data),"Consigne enregistrée")}
    return}
  if(a==="consdel"){confirmDel=true;consigneForm(consEdit);return}
  if(a==="consdelno"){confirmDel=false;consigneForm(consEdit);return}
  if(a==="consdelyes"){confirmDel=false;if(await save(db=>db.doc("consignes/"+id).delete(),"Consigne supprimée"))closeSheet();return}
  // réglages
  if(a==="savereg"){const v=i=>document.getElementById(i).value;const d={...(S.reglages||{}),debut:v("rDeb"),fin:v("rFin"),pauseDebut:v("rPd"),pauseFin:v("rPf"),marge:Math.max(0,parseInt(v("rMarge"),10)||0)};
    if(!(toMin(d.debut)<toMin(d.pauseDebut)&&toMin(d.pauseDebut)<=toMin(d.pauseFin)&&toMin(d.pauseFin)<toMin(d.fin))){toast("Vérifiez l'ordre : début, pause, reprise, fin");return}
    if(await save(db=>db.doc("reglages/chantier").set(d),"Réglages enregistrés"))closeSheet();return}
  if(a==="clearex"){confirmDel=true;reglagesForm();return}
  if(a==="clearexno"){confirmDel=false;reglagesForm();return}
  if(a==="clearexyes"){confirmDel=false;await save(async db=>{
      for(const t of S.taches.filter(x=>x.exemple))await db.doc("taches/"+t.id).delete();
      for(const j of S.journal.filter(x=>x.exemple))await db.doc("journal/"+j.id).delete();
      for(const c of S.consignes.filter(x=>x.exemple))await db.doc("consignes/"+c.id).delete();
      for(const r of S.recs.filter(x=>x.exemple))await db.doc("recurrences/"+r.id).delete();
      for(const d of S.demandes.filter(x=>x.exemple))await db.doc("demandes/"+d.id).delete();
    },"Exemples effacés");closeSheet();return}
});

document.addEventListener("change",async e=>{
  if(e.target.id!=="phFile")return;const file=e.target.files&&e.target.files[0];if(!file)return;
  const ctx=e.target.dataset.ctx;const cat=document.getElementById("phCat").value;const leg=document.getElementById("phLeg").value.trim();
  toast("Envoi de la photo…");
  const pid=await uploadPhoto(file);if(!pid)return;
  const p={id:pid,cat,legende:leg,at:new Date().toISOString()};
  if(ctx==="t"){const t=findT(openId);await updTache(openId,{photos:[...(t.photos||[]),p]},"Photo ajoutée")}
  else if(ctx==="c"){const c=S.consignes.find(x=>x.id===consEdit.id);const ps=[...((c&&c.photos)||[]),p];if(await save(db=>db.doc("consignes/"+consEdit.id).update({photos:ps}),"Photo ajoutée")){consEdit.photos=ps;consigneForm({...consEdit})}}
});

/* re-render open sheet when data changes */
const _render=render;
render=function(){_render();if(layer.querySelector("[data-acc]")&&!layer.contains(document.activeElement))drawAccueil();if(openId&&layer.innerHTML&&layer.querySelector("#dDeb")&&!layer.contains(document.activeElement)){detail(openId)}};
setInterval(()=>{if(isToday()&&S.tab==="jour"&&!layer.innerHTML)render()},60000);
render();
boot();
})();
</script>
